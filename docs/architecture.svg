<title id="title">CCTool architecture</title><desc id="desc">React talks to the native Rust core. Rust invokes macOS APIs, launches a dedicated browser with token-scoped local reports, and connects to a user-provided VPS over explicit SSH for a residential SOCKS5 exit.</desc>
